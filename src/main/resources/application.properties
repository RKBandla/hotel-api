spring.application.name=hotel-api

# MongoDB Atlas connection - the real URI comes from an environment variable (never commit passwords)
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hotel}
spring.mongodb.database=hotel

# JWT - the secret signs the tokens (at least 32 characters). Set JWT_SECRET as an env variable in real use.
jwt.secret=${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
# token valid for 1 hour
jwt.expiration-ms=3600000